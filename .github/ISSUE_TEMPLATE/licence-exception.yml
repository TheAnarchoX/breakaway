name: Licence exception request
description: Ask for a free commercial licence for a worker co-op or a digital rights or privacy group.
title: 'Licence exception: <your group>'
labels: ['licence exception']
body:
  - type: markdown
    attributes:
      value: |
        breakaway is free for personal and noncommercial use. The owner grants a free commercial licence case by case to worker co-ops and to digital rights and privacy groups, including projects that build software to give people back ownership of their digital lives. A company funded by venture capital can't get one. [leavethepack.dev/licensing](https://leavethepack.dev/licensing/) says who uses breakaway free and what counts as commercial.

        This request is public: put nothing private in it. Or email, if you'd rather not ask in public: write to theanarchox@proton.me with the subject `breakaway licence exception: <who you are>`. Asking is no promise of a yes, and a request isn't a licence: an exception starts when both sides have signed the [licence exception agreement](https://github.com/TheAnarchoX/breakaway/blob/main/docs/licence-exception-agreement.md).
  - type: input
    id: group
    attributes:
      label: Who you are
      description: Your group's name, and a link to its site or its work.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of group you are
      options:
        - A worker co-op
        - A digital rights or privacy group
        - Something else
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why it fits
      description: What your group does, and why it fits what breakaway is for.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: How you're owned and funded
      description: Who owns the group, and whether any of its money comes from venture capital.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What you'd use breakaway for
      description: The work it would run, and roughly how many people would use it.
    validations:
      required: true
  - type: checkboxes
    id: understood
    attributes:
      label: Before you send it
      options:
        - label: My group takes no money from venture capital.
          required: true
        - label: I understand this request is public, and that asking is no promise of a yes.
          required: true
