# Releases (BRK-6). breakaway publishes releases and never deploys: every install deploys a release from
# its own repository, so this repository holds no Cloudflare credentials. Keep this file's name: npm's
# trusted publisher (BRK-7) is set to it, with the npm environment, and `npm stage publish` has to run from a job in this file.
name: Release

on:
  # Every push to main, once CI has passed on it: a pre-release on the main channel.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # The owner promotes a chosen pre-release to stable. Agents never run this.
  workflow_dispatch:
    inputs:
      prerelease:
        description: The pre-release to promote, like v0.2.0-main.5
        required: true
        type: string
      # BRK-118: pre-releases count patches from the stable by themselves. With minor or major, once the stable is out,
      # the next-version job opens the pull request that sets package.json to the next minor or major after it.
      next:
        description: What main works toward next. Patch opens nothing; minor or major opens a pull request that sets package.json
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  AREAS: BRK:Board,WEB:Web,DOC:Docs,LCH:Launch,ID:Brand,CLI:CLI

jobs:
  prerelease:
    name: pre-release
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm environment holds NPM_TOKEN, and only main can use it (BRK-75).
    environment: npm
    permissions:
      contents: write
      id-token: write
      # The notes read each pull request's title, which a private repository answers 403 without (BRK-57).
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Pick the version
        id: next
        run: |
          git tag -l > "$RUNNER_TEMP/tags"
          node scripts/release/plan.mjs prerelease "$RUNNER_TEMP/tags" >> "$GITHUB_OUTPUT"
          git tag -l 'v*' --sort=-creatordate | head -1 > "$RUNNER_TEMP/previous"
      - name: Build once
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          pnpm build
          mkdir -p out/bundle/worker
          cp -r src package.json release.json out/bundle/worker/
          cp -r dist out/bundle/dist
          # The packages the Worker imports, as the lockfile pins them, so a Deploy runs no npm install (BRK-56).
          node scripts/release/vendor.mjs out/bundle
          tar -czf out/breakaway-bundle.tar.gz -C out/bundle .
      - name: Manifest, checksums, notes
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          node scripts/release/plan.mjs manifest main "$VERSION" "$SHA" --bundle out/breakaway-bundle.tar.gz > out/manifest.json
          (cd out && sha256sum breakaway-bundle.tar.gz manifest.json > SHA256SUMS)
          from=$(cat "$RUNNER_TEMP/previous"); from=${from:-$(git rev-list --max-parents=0 "$SHA" | tail -1)}
          node scripts/release-notes.mjs --title breakaway --version "v$VERSION" --from "$from" --to "$SHA" --areas "$AREAS" > out/notes.md
          node scripts/release/plan.mjs manual >> out/notes.md
      # BRK-51: the manifest holds the bundle's checksum (bundleSha256, BRK-52), so one signature covers the bundle. RELEASE_SIGNING_KEY is
      # a secret of the npm environment (only main can use it), never a repository secret: the site job passes those on.
      - name: Sign the manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/release/sign.mjs out/manifest.json out/manifest.json.sig
      - name: Publish the pre-release
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          gh release create "$TAG" out/breakaway-bundle.tar.gz out/manifest.json out/manifest.json.sig out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --notes-file out/notes.md --prerelease
      # The CLI (BRK-7): the same version, on the next dist-tag, staged: it goes live only when the owner approves it with
      # 2FA (npm stage approve, or Staged Packages on npmjs.com). npm tries trusted publishing first (npm 11.15.0 or newer).
      # It can't read this repository's OIDC subject yet (npm/cli#9969), so until it can, NPM_TOKEN stands in: a token
      # that doesn't bypass 2FA, so it can stage a version and never publish one by itself (BRK-75).
      # Only from a public repository: npm refuses provenance from a private one, and nothing goes to npm before launch (BRK-57).
      - name: Stage the CLI on npm
        if: ${{ !github.event.repository.private }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@^11.15.0
          # npm says why trusted publishing didn't apply only in its verbose log. Keep that log to the runner and show npm's
          # usual lines, and on a failure its oidc lines: the Actions logs are public, so never the whole verbose log.
          if npm stage publish --provenance --access public --tag next --loglevel verbose > "$RUNNER_TEMP/npm.log" 2>&1; then
            grep -vE '^npm (verbose|http|timing|silly)' "$RUNNER_TEMP/npm.log" || true
            echo "::notice title=Staged on npm::breakaway@$(node -p "require('./package.json').version") goes live on next once the owner approves it with 2FA: npm stage approve <id>, or Staged Packages on npmjs.com."
          else
            grep -vE '^npm (verbose|http|timing|silly)' "$RUNNER_TEMP/npm.log" || true
            echo "npm's trusted publishing (OIDC):"
            oidc=$(grep -i 'oidc' "$RUNNER_TEMP/npm.log" | grep -v 'eyJ' | cut -c1-300 || true)
            echo "${oidc:-npm logged nothing about it.}"
            echo "::error title=npm refused to stage it::Until npm reads GitHub's immutable OIDC subjects (npm/cli#9969), the npm environment needs NPM_TOKEN: a granular token with read and write access to this package that doesn't bypass 2FA. After that, npm's trusted publisher must name exactly: GitHub Actions, user ${GITHUB_REPOSITORY%%/*}, repository ${GITHUB_REPOSITORY#*/}, workflow release.yml, environment npm."
            exit 1
          fi

  stable:
    name: stable
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    outputs:
      version: ${{ steps.promote.outputs.version }}
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Promote the bundle unchanged
        id: promote
        run: |
          set -euo pipefail
          version=$(node scripts/release/plan.mjs stable "$PRERELEASE" | sed 's/^version=//')
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version already exists." >&2; exit 1; fi
          mkdir -p in out
          gh release download "$PRERELEASE" --repo "$GITHUB_REPOSITORY" --dir in
          (cd in && sha256sum --check SHA256SUMS)
          cp in/breakaway-bundle.tar.gz out/
          commit=$(node -p "require('./in/manifest.json').commit")
          # The stable's manifest is the pre-release's with the new version; the bundle itself is untouched.
          export V=$version
          node -e "
            const fs=require('fs');const m=JSON.parse(fs.readFileSync('in/manifest.json'));
            m.builtAs=m.version;m.version=process.env.V;m.channel='stable';m.created=new Date().toISOString();
            fs.writeFileSync('out/manifest.json',JSON.stringify(m,null,2)+'\n');"
          (cd out && sha256sum breakaway-bundle.tar.gz manifest.json > SHA256SUMS)
          from=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          from=${from:-$(git rev-list --max-parents=0 "$commit" | tail -1)}
          node scripts/release-notes.mjs --title breakaway --version "v$version" --from "$from" --to "$commit" --areas "$AREAS" > out/notes.md
          # The stable's own words, when docs/releases has them (on the branch the workflow runs from), go under the heading.
          export OWN="docs/releases/v$version.md"
          node -e "
            const fs=require('fs');if(!fs.existsSync(process.env.OWN))process.exit(0);
            const [head,...rest]=fs.readFileSync('out/notes.md','utf8').split('\n');
            fs.writeFileSync('out/notes.md',[head,'',fs.readFileSync(process.env.OWN,'utf8').trim(),'','---',...rest].join('\n'));"
          node -e "
            const m=require('./out/manifest.json');
            if(m.manual)process.stdout.write('\n### Manual steps\n\n'+m.manualSteps.map(s=>'- '+s).join('\n')+'\n');" >> out/notes.md
          # The stable's manifest differs from the pre-release's, so it is signed again.
          RELEASE_SIGNING_KEY="$RELEASE_SIGNING_KEY" node scripts/release/sign.mjs out/manifest.json out/manifest.json.sig
          gh release create "v$version" out/breakaway-bundle.tar.gz out/manifest.json out/manifest.json.sig out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$commit" --title "v$version" --notes-file out/notes.md --latest
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # The CLI (BRK-7): the commit's files under the stable version, as latest, staged for the owner's approval, and only
      # from a public repository, as in the pre-release (BRK-57). The same npm and NPM_TOKEN as there (BRK-75).
      - name: Stage the CLI on npm
        if: ${{ !github.event.repository.private }}
        env:
          V: ${{ steps.promote.outputs.version }}
          COMMIT: ${{ steps.promote.outputs.commit }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git checkout --detach "$COMMIT"
          node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.version=process.env.V;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          npm install -g npm@^11.15.0
          # npm says why trusted publishing didn't apply only in its verbose log. Keep that log to the runner and show npm's
          # usual lines, and on a failure its oidc lines: the Actions logs are public, so never the whole verbose log.
          if npm stage publish --provenance --access public --tag latest --loglevel verbose > "$RUNNER_TEMP/npm.log" 2>&1; then
            grep -vE '^npm (verbose|http|timing|silly)' "$RUNNER_TEMP/npm.log" || true
            echo "::notice title=Staged on npm::breakaway@$(node -p "require('./package.json').version") goes live on latest once the owner approves it with 2FA: npm stage approve <id>, or Staged Packages on npmjs.com."
          else
            grep -vE '^npm (verbose|http|timing|silly)' "$RUNNER_TEMP/npm.log" || true
            echo "npm's trusted publishing (OIDC):"
            oidc=$(grep -i 'oidc' "$RUNNER_TEMP/npm.log" | grep -v 'eyJ' | cut -c1-300 || true)
            echo "${oidc:-npm logged nothing about it.}"
            echo "::error title=npm refused to stage it::Until npm reads GitHub's immutable OIDC subjects (npm/cli#9969), the npm environment needs NPM_TOKEN: a granular token with read and write access to this package that doesn't bypass 2FA. After that, npm's trusted publisher must name exactly: GitHub Actions, user ${GITHUB_REPOSITORY%%/*}, repository ${GITHUB_REPOSITORY#*/}, workflow release.yml, environment npm."
            exit 1
          fi

  # BRK-118: with next minor or major, a pull request sets package.json to the next minor or major after the stable, so
  # the next merge publishes vX.Y.0-main.1 instead of the stable's next patch. It runs after the stable is published,
  # in its own job with no environment and no secrets, and writes through GitHub's API, so no credentials are kept in a
  # checkout. A pull request opened with GITHUB_TOKEN starts no workflows, so CI runs on it once the owner closes and
  # reopens it, or pushes to it (the README's releases section).
  next-version:
    name: next version
    needs: stable
    if: inputs.next == 'minor' || inputs.next == 'major'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      STABLE: ${{ needs.stable.outputs.version }}
      NEXT: ${{ inputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Open the pull request that sets the version
        run: |
          set -euo pipefail
          version=$(node scripts/release/plan.mjs next "$STABLE" "$NEXT" | sed 's/^version=//')
          if [ -z "$version" ]; then
            echo "::notice title=No version to set::main's package.json is already at or past the next $NEXT after v$STABLE."
            exit 0
          fi
          branch="next-version/v$version"
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "::notice title=Already open::A pull request from $branch sets $version."
            exit 0
          fi
          # A run GitHub refused the pull request leaves its branch (BRK-127): open the pull request from it.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            base=$(git rev-parse HEAD)
            blob=$(git rev-parse HEAD:package.json)
            export V=$version
            node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.version=process.env.V;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base" >/dev/null
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/package.json" -f "branch=$branch" -f "sha=$blob" \
              -f "message=Set the version to $version" -f "content=$(base64 -w0 package.json)" >/dev/null
          fi
          printf '%s\n' \
            "v$STABLE is out, and the Release workflow was run with next $NEXT: this sets package.json's version to $version." \
            "" \
            "Once it merges, the next pre-release is v$version-main.1 instead of v$STABLE's next patch." \
            "" \
            "Opened with the workflow's token, which starts no workflows: close and reopen this pull request, or push to it, for CI to run." \
            > "$RUNNER_TEMP/body.md"
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Set the version to $version" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error title=GitHub refused the pull request::$branch sets $version, but the repository doesn't let Actions open pull requests. Turn on Settings, Actions, General, Allow GitHub Actions to create and approve pull requests, then re-run this job, or open the pull request from $branch yourself."
            exit 1
          fi

  # The site follows the stable release (LCH-15): the Site workflow moves the site branch to it, and Cloudflare's
  # Workers Builds deploys that branch. A called workflow sees only the secrets it inherits, so this passes them on
  # (LCH-18) and the site environment's deploy key reaches it; the repository has no other secrets to pass.
  site:
    name: site
    needs: stable
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml
    with:
      ref: v${{ needs.stable.outputs.version }}
    secrets: inherit

  # The plugin follows the stable release too (LCH-24): the Plugin workflow moves the plugin branch, which Anthropic's
  # plugin directory and this repository's marketplace follow, to the released tag with plugin.json at its version. It
  # inherits the secrets for the same reason as the site job, so the plugin environment's deploy key reaches it.
  plugin:
    name: plugin
    needs: stable
    permissions:
      contents: read
    uses: ./.github/workflows/plugin.yml
    with:
      ref: v${{ needs.stable.outputs.version }}
    secrets: inherit
