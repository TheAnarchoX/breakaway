name: Plugin check

# CLI-7: the plugin in plugin/ and the marketplace that offers it pass Claude Code's own validator, strictly, on every
# pull request that touches them, so the plugin directory's checks never fail first at a release. The Plugin workflow
# (LCH-24) runs the same check before it moves the plugin branch.
on:
  pull_request:
    paths:
      - plugin/**
      - .claude-plugin/**
      - .agents/skills/tasks/**
      - scripts/plugin.mjs
      - src/init.js
      - .github/workflows/plugin-check.yml

permissions:
  contents: read

concurrency:
  group: plugin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Pinned, so a new Claude Code can't turn a pull request red by itself; move it on purpose.
      - run: npx --yes @anthropic-ai/claude-code@2.1.289 plugin validate --strict plugin
      - run: npx --yes @anthropic-ai/claude-code@2.1.289 plugin validate --strict .
