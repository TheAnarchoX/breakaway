name: CLA

# BRK-296, BRK-306: anyone outside breakaway who opens a pull request signs the contributor licence agreement (CLA.md)
# first, so the owner can license every part of breakaway the same way and grant commercial exceptions. A signature
# counts only once three things are on the pull request: a signed copy of CLA.md the contributor uploaded in a comment,
# their comment with the sign phrase, and, after both, the owner's countersign comment. Then it's recorded on the
# cla-signatures branch (signatures/signed.json); until then the check stays red and says what's missing. The logic is
# scripts/cla/cla.js, tested in scripts/cla/cla.test.js. No third-party service.
#
# The owner's own pull requests (the board's agents open theirs as the owner) and the bots' are exempt by author, so
# the job is skipped for them. The owner is github.repository_owner, matched on a comment's author, never a name in a
# comment's text.
#
# pull_request_target and issue_comment run this file from the default branch with a token that can write. The job
# checks out only scripts/cla/ and package.json from the default branch, never the pull request's code, and reads
# comments as data through the API: no comment, name, or link reaches a run: line.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Re-runs the pull request's check after a comment.
      actions: write
      # Writes signatures/signed.json on the cla-signatures branch.
      contents: write
      # Reads the commits and comments, and keeps the check's comment up to date.
      pull-requests: write
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.user.login != github.repository_owner &&
        !contains(fromJSON('["dependabot[bot]","github-actions[bot]","breakaway-integration[bot]"]'), github.event.pull_request.user.login)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        github.event.issue.user.login != github.repository_owner &&
        !contains(fromJSON('["dependabot[bot]","github-actions[bot]","breakaway-integration[bot]"]'), github.event.issue.user.login) &&
        (github.event.comment.body == 'recheck' ||
          contains(github.event.comment.body, 'I have read the breakaway CLA and I sign it') ||
          contains(github.event.comment.body, 'I countersign the breakaway CLA') ||
          contains(github.event.comment.body, 'github.com/user-attachments/')))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default branch's check, never the pull request's head.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # The check, and package.json so Node reads it as a module.
          sparse-checkout: |
            /scripts/cla/
            /package.json
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/cla/cla.js`);
            await run({ github, context, core });
