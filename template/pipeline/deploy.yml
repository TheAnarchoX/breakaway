# {{header}}
#
# Deploy: a merge to {{branchName}} that passes its checks goes to staging, the Worker {{stagingName}}. Production
# changes only when the owner promotes a staging build (promote.yml). The build is kept as the workflow artifact
# release-<commit>, and Promote deploys those same files to production. Deploys record GitHub Deployments, which the
# board reads. Agents never run this workflow.
name: Deploy

on:
  # After every check workflow has passed on a push to {{branchName}}: each one's completion starts this, and only the
  # run that finds them all passed deploys.
  workflow_run:
    workflows: {{checks}}
    types: [completed]
    branches: [{{branch}}]
  # By hand: deploy {{branchName}}'s latest commit to staging, once its checks have passed.
  workflow_dispatch:

permissions: {}

# One staging deploy at a time. One that waits finds staging already runs its commit, or a newer one, and stops.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  STAGING: {{staging}}
  BRANCH: {{branch}}
  CHECKS: {{checksEnv}}
  HEALTH_URL: {{healthStaging}}

jobs:
  staging:
    name: staging
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CLOUDFLARE_API_TOKEN is a secret of this environment, which only {{branchName}} may use: a token for the staging
    # Worker only. CLOUDFLARE_ACCOUNT_ID is a repository variable.
    environment: staging
    permissions:
      contents: read
      deployments: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # What the repository's own commands (beforeDeploy) read to know where they run.
      BREAKAWAY_ENV: staging
      WORKER: {{staging}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check it should deploy
        id: plan
        run: node scripts/deploy-plan.mjs plan --staging "$STAGING" --sha "$SHA" --branch "$BRANCH" --checks "$CHECKS" --paths .github/deploy-paths.json >> "$GITHUB_OUTPUT"

      - name: Record the start
        id: record
        if: steps.plan.outputs.deploy == 'true'
        run: node scripts/record-deployment.mjs --environment "$STAGING" --sha "$SHA" --state in_progress --description "pre-release · building" --log-url "$RUN_URL"

      - name: Install and build
        if: steps.plan.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          if grep -q '"packageManager"' package.json 2>/dev/null; then corepack enable; fi
          {{@install}}
          {{@build}}

      - name: Keep the build as the release artifact
        id: artifact
        if: steps.plan.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          # The commit as installed and built: Promote deploys these files to production, and builds nothing.
          mkdir -p "$RUNNER_TEMP/release"
          tar --exclude=./.git -czf "$RUNNER_TEMP/release/tree.tgz" .
          echo "digest=$(node scripts/release-artifact.mjs digest "$RUNNER_TEMP/release")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.deploy == 'true'
        with:
          name: release-${{ github.event.workflow_run.head_sha || github.sha }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Deploy to staging
        id: deploy
        if: steps.plan.outputs.deploy == 'true'
        env:
          FROM: ${{ steps.plan.outputs.from }}
          DEPLOYMENT: ${{ steps.record.outputs.deployment }}
        run: |
          set -euo pipefail
          wrangler() { npx --yes wrangler "$@" --name "$WORKER"{{stagingEnvFlag}}; }
          step() { node scripts/record-deployment.mjs --deployment "$DEPLOYMENT" --state in_progress --description "pre-release · $1" > /dev/null; }
          # The version running now, which a failed check goes back to. Only a Worker that doesn't exist yet has none:
          # any other failure to list stops here, since deploying with nothing to go back to isn't safe.
          previous=""
          if wrangler deployments list --json > "$RUNNER_TEMP/deployments.json" 2> "$RUNNER_TEMP/list-error.txt"; then
            previous=$(node scripts/deploy-plan.mjs current < "$RUNNER_TEMP/deployments.json" | sed 's/^version=//')
          else
            cat "$RUNNER_TEMP/deployments.json" "$RUNNER_TEMP/list-error.txt" | node scripts/deploy-plan.mjs missing > /dev/null
          fi
          # The migrations this deploy runs: the ones added since staging's last deploy.
          migrations=""
          if [ -d migrations ]; then
            node scripts/check-migrations.mjs --dir migrations ${FROM:+--base "$FROM"}
            if [ -n "$FROM" ]; then
              migrations=$(git diff --name-only --diff-filter=A "$FROM" "$SHA" -- migrations | grep '\.sql$' | xargs -r -n1 basename | paste -sd, - || true)
            fi
          fi
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          step migrating
          {{@beforeDeploy}}
          step deploying
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          if [ -z "$previous" ]; then
            # The first deploy makes the Worker.
            wrangler deploy --message "${SHA:0:7}"
            version=$(node scripts/deploy-plan.mjs uploaded < "$WRANGLER_OUTPUT_FILE_PATH" | sed 's/^version=//')
          else
            wrangler versions upload --message "${SHA:0:7}"
            version=$(node scripts/deploy-plan.mjs uploaded < "$WRANGLER_OUTPUT_FILE_PATH" | sed 's/^version=//')
            wrangler versions deploy "$version@100%" --message "${SHA:0:7}" --yes
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          step checking
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice title=Not checked::Staging runs ${SHA:0:7} as version $version. Set healthCheck in .github/breakaway-pipeline.json and the next deploy checks it, and goes back if it doesn't answer."
            exit 0
          fi
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 10 -o /dev/null "$HEALTH_URL"; then
              echo "Staging runs ${SHA:0:7} as version $version, and $HEALTH_URL answers."
              exit 0
            fi
            sleep 5
          done
          if [ -n "$previous" ] && wrangler rollback "$previous" --message "${SHA:0:7} failed its check" --yes; then
            echo "rolled_back=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Rolled back::${SHA:0:7} didn't answer $HEALTH_URL within 90 seconds, so staging went back to version $previous. Read the Worker's logs on Cloudflare."
          else
            echo "::error title=Failed its check::${SHA:0:7} didn't answer $HEALTH_URL within 90 seconds, and staging had no version to go back to. Read the Worker's logs on Cloudflare."
          fi
          exit 1

      - name: Record the end
        if: always() && steps.record.outputs.deployment
        env:
          DEPLOYMENT: ${{ steps.record.outputs.deployment }}
          OUTCOME: ${{ job.status }}
          VERSION: ${{ steps.deploy.outputs.version }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          MIGRATIONS: ${{ steps.deploy.outputs.migrations }}
          ROLLED_BACK: ${{ steps.deploy.outputs.rolled_back }}
        run: |
          set -euo pipefail
          record() { node scripts/record-deployment.mjs --deployment "$DEPLOYMENT" --log-url "$RUN_URL" "$@" > /dev/null; }
          if [ "$OUTCOME" = success ]; then
            record --state success --note pre-release --version "$VERSION" --artifact "$DIGEST" --migrations "$MIGRATIONS" ${HEALTH_URL:+--environment-url "$HEALTH_URL"}
          elif [ "$ROLLED_BACK" = true ]; then
            record --state failure --description "rolled back: version $VERSION failed its check"
          else
            record --state failure --description "failed: the run says why"
          fi
