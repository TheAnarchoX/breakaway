# {{header}}
#
# Promote: puts the staging build the owner chose live on production, the Worker {{productionName}}. It deploys the
# files Deploy built and kept for that commit, and builds nothing. The board's Promote button starts it, or Actions,
# Run workflow, with the commit staging runs. Agents never run this workflow.
name: Promote

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The full commit of the staging build to put live
        required: true
        type: string
      destructive_ok:
        description: I've read the destructive migrations it carries, and they may run
        required: false
        default: false
        type: boolean

permissions: {}

# Production deploys one at a time, and a rollback waits for a promote (and the other way round).
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  STAGING: {{staging}}
  PRODUCTION: {{production}}
  BRANCH: {{branch}}
  HEALTH_URL: {{healthProduction}}

jobs:
  production:
    name: production
    if: github.ref == 'refs/heads/{{branchName}}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CLOUDFLARE_API_TOKEN is a secret of this environment, which only {{branchName}} may use: a token for the
    # production Worker only.
    environment: production
    permissions:
      contents: write
      deployments: write
      actions: read
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOYS_PAUSED: ${{ vars.DEPLOYS_PAUSED }}
      SHA: ${{ inputs.sha }}
      DESTRUCTIVE_OK: ${{ inputs.destructive_ok }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BREAKAWAY_ENV: production
      WORKER: {{production}}
    steps:
      # The helpers run from {{branchName}}; the build comes from the artifact Deploy kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch the staging build
        id: artifact
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Not a commit::Give the full commit of the staging build to promote (40 characters)."
            exit 1
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=release-$SHA&per_page=1" --jq '[.artifacts[] | select(.expired | not)][0].id // empty')
          if [ -z "$id" ]; then
            echo "::error title=No stored build::Deploy kept no build of ${SHA:0:7}, or it expired after 90 days, so there is nothing to promote. Merge to $BRANCH to make a new candidate."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/release.zip"
          unzip -q "$RUNNER_TEMP/release.zip" -d "$RUNNER_TEMP/release"
          echo "digest=$(node scripts/release-artifact.mjs digest "$RUNNER_TEMP/release")" >> "$GITHUB_OUTPUT"

      # The same refusals as the board's Promote button, checked again here: not paused, the latest successful staging
      # build, on {{branchName}}, not live already, and the stored build is the one staging ran.
      - name: Check the candidate
        id: check
        env:
          DIGEST: ${{ steps.artifact.outputs.digest }}
        run: node scripts/promote-check.mjs --staging "$STAGING" --production "$PRODUCTION" --sha "$SHA" --artifact-digest "$DIGEST" --branch "$BRANCH"

      - name: Check its migrations
        id: migrations
        run: |
          set -euo pipefail
          live=$(node scripts/deploy-plan.mjs live --environment "$PRODUCTION" | sed 's/^sha=//')
          echo "live=$live" >> "$GITHUB_OUTPUT"
          if [ -n "$live" ]; then
            added=$(git diff --name-only --diff-filter=A "$live" "$SHA" -- migrations | grep '\.sql$' || true)
          else
            added=$(git ls-tree -r --name-only "$SHA" -- migrations | grep '\.sql$' || true)
          fi
          echo "migrations=$(echo "$added" | xargs -r -n1 basename | paste -sd, -)" >> "$GITHUB_OUTPUT"
          # A migration that destroys data carries an owner-approved line, and runs only when the owner ticked it.
          destructive=""
          for file in $added; do
            if git show "$SHA:$file" | grep -qE '^[[:space:]]*--[[:space:]]*owner-approved:[[:space:]]*[^[:space:]]'; then destructive="$destructive $(basename "$file")"; fi
          done
          if [ -n "$destructive" ] && [ "$DESTRUCTIVE_OK" != true ]; then
            echo "::error title=Destructive migration::${SHA:0:7} carries a migration that destroys data:$destructive. Read it, then promote again with destructive_ok."
            exit 1
          fi

      - name: Record the start
        id: record
        run: |
          node scripts/record-deployment.mjs --environment "$PRODUCTION" --sha "$SHA" --production --state in_progress --description "promoting: starting" --log-url "$RUN_URL"

      - name: Deploy to production
        id: deploy
        env:
          DEPLOYMENT: ${{ steps.record.outputs.deployment }}
        run: |
          set -euo pipefail
          helpers="$GITHUB_WORKSPACE/scripts"
          step() { node "$helpers/record-deployment.mjs" --deployment "$DEPLOYMENT" --state in_progress --description "promoting: $1" > /dev/null; }
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/release/tree.tgz" -C "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          wrangler() { npx --yes wrangler "$@" --name "$WORKER"{{productionEnvFlag}}; }
          previous=""
          if wrangler deployments list --json > "$RUNNER_TEMP/deployments.json" 2> "$RUNNER_TEMP/list-error.txt"; then
            previous=$(node "$helpers/deploy-plan.mjs" current < "$RUNNER_TEMP/deployments.json" | sed 's/^version=//')
          else
            cat "$RUNNER_TEMP/deployments.json" "$RUNNER_TEMP/list-error.txt" | node "$helpers/deploy-plan.mjs" missing > /dev/null
          fi
          step migrating
          {{@beforeDeploy}}
          step deploying
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          if [ -z "$previous" ]; then
            wrangler deploy --message "${SHA:0:7}"
            version=$(node "$helpers/deploy-plan.mjs" uploaded < "$WRANGLER_OUTPUT_FILE_PATH" | sed 's/^version=//')
          else
            wrangler versions upload --message "${SHA:0:7}"
            version=$(node "$helpers/deploy-plan.mjs" uploaded < "$WRANGLER_OUTPUT_FILE_PATH" | sed 's/^version=//')
            wrangler versions deploy "$version@100%" --message "${SHA:0:7}" --yes
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          step checking
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice title=Not checked::Production runs ${SHA:0:7} as version $version. Set healthCheck.production in .github/breakaway-pipeline.json and the next promote checks it, and goes back if it doesn't answer."
            exit 0
          fi
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 10 -o /dev/null "$HEALTH_URL"; then
              echo "Production runs ${SHA:0:7} as version $version, and $HEALTH_URL answers."
              exit 0
            fi
            sleep 5
          done
          if [ -n "$previous" ] && wrangler rollback "$previous" --message "${SHA:0:7} failed its check" --yes; then
            echo "rolled_back=true" >> "$GITHUB_OUTPUT"
            echo "::error title=Rolled back::${SHA:0:7} didn't answer $HEALTH_URL within 90 seconds, so production went back to version $previous. Read the Worker's logs on Cloudflare."
          else
            echo "::error title=Failed its check::${SHA:0:7} didn't answer $HEALTH_URL within 90 seconds, and production had no version to go back to. Read the Worker's logs on Cloudflare."
          fi
          exit 1

      - name: Record the end
        if: always() && steps.record.outputs.deployment
        env:
          DEPLOYMENT: ${{ steps.record.outputs.deployment }}
          OUTCOME: ${{ job.status }}
          VERSION: ${{ steps.deploy.outputs.version }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          MIGRATIONS: ${{ steps.migrations.outputs.migrations }}
          ROLLED_BACK: ${{ steps.deploy.outputs.rolled_back }}
        run: |
          set -euo pipefail
          record() { node scripts/record-deployment.mjs --deployment "$DEPLOYMENT" --log-url "$RUN_URL" "$@" > /dev/null; }
          if [ "$OUTCOME" = success ]; then
            record --state success --version "$VERSION" --artifact "$DIGEST" --migrations "$MIGRATIONS" ${HEALTH_URL:+--environment-url "$HEALTH_URL"}
          elif [ "$ROLLED_BACK" = true ]; then
            record --state failure --description "rolled back: version $VERSION failed its check"
          else
            record --state failure --description "failed: the run says why"
          fi

      # Production only: a tag and a GitHub release with every pull request since what production ran before.
      - name: Tag and release
        env:
          LIVE: ${{ steps.migrations.outputs.live }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$(date -u +%Y%m%d)-${SHA:0:7}"
          from=${LIVE:-$(git rev-list --max-parents=0 "$SHA" | tail -1)}
          node scripts/release-notes.mjs --title "${GITHUB_REPOSITORY#*/}" --version "$tag" --from "$from" --to "$SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest
