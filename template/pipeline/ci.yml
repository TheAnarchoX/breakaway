# {{ciHeader}}
#
# CI: install, build, and test every pull request and every push to {{branchName}}. Deploy and Release run only after
# it passes on {{branchName}}, so a change that breaks it never ships. This file is the repository's own: change its
# steps to taste, and if you rename it, change checks in .github/breakaway-pipeline.json to match.
name: CI

on:
  push:
    branches: [{{branch}}]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install, build, and test
        run: |
          set -euo pipefail
          if grep -q '"packageManager"' package.json 2>/dev/null; then corepack enable; fi
          {{@install}}
          {{@build}}
          {{@test}}
