# Looks for a newer breakaway release every hour. On the stable channel it opens (or refreshes) a pull request that bumps
# breakaway.json; merging it deploys. On the main channel it starts Deploy when a newer pre-release than the running one exists.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  BREAKAWAY_REPO: TheAnarchoX/breakaway
  BREAKAWAY_FEED: ${{ vars.BREAKAWAY_FEED }}

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Reads breakaway's releases with this repository's own token, or BREAKAWAY_READ_TOKEN for a private BREAKAWAY_REPO.
      READ_TOKEN: ${{ secrets.BREAKAWAY_READ_TOKEN || github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Look for a newer release
        id: plan
        env:
          ADDRESS: ${{ vars.BREAKAWAY_URL }}
        run: |
          set -euo pipefail
          # The newest release's CLI makes the plan, from that release's own source on GitHub (BRK-61): it needs only
          # Node, no npm package, so it works while breakaway's repository is private.
          newest=$(GH_TOKEN="$READ_TOKEN" gh release list --repo "$BREAKAWAY_REPO" --limit 1 --json tagName --jq '.[0].tagName // empty') || newest=""
          if [ -z "$newest" ]; then
            echo "::error title=No release to read::This repository can't read a release of $BREAKAWAY_REPO. If that repository is private, add BREAKAWAY_READ_TOKEN as a repository secret: a fine-grained token with read access to its contents."
            exit 1
          fi
          dir="$RUNNER_TEMP/breakaway-$newest"
          mkdir -p "$dir"
          GH_TOKEN="$READ_TOKEN" gh release download "$newest" --repo "$BREAKAWAY_REPO" --archive tar.gz -O - | tar -xz -C "$dir" --strip-components 1
          cli="$dir/scripts/tasks.mjs"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          address=${ADDRESS:-$(node -p "require('./breakaway.config.json').url || ''")}
          running=""
          # A board that doesn't say its release (one from before BRK-10) runs none the plan knows.
          if [ -n "$address" ]; then running=$(curl -fsS --max-time 20 "$address/api/ping" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).release ?? ''" 2>/dev/null || true); fi
          curl -fsS --retry 3 "$BREAKAWAY_FEED" -o releases.json || echo '{}' > releases.json
          plan() { node "$cli" install update --releases releases.json --repo "$BREAKAWAY_REPO" --running "$running" --manifest release/manifest.json --notes release/notes.md --body release/body.md; }
          mkdir -p release
          out=$(plan)
          if ! printf '%s\n' "$out" | grep -q '^action=\(bump\|deploy\)'; then
            # The feed has nothing (it's down, or has none of BREAKAWAY_REPO's): ask GitHub.
            GH_TOKEN="$READ_TOKEN" gh api "repos/$BREAKAWAY_REPO/releases?per_page=100" > releases.json || true
            out=$(plan)
          fi
          printf '%s\n' "$out" | tee -a "$GITHUB_OUTPUT"
          git checkout -- breakaway.json

      - name: Open or refresh the update pull request
        if: ${{ steps.plan.outputs.action == 'bump' }}
        env:
          CLI: ${{ steps.plan.outputs.cli }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
        run: |
          set -euo pipefail
          # The release's manifest and notes, for the pull request; the plan is made again with them.
          GH_TOKEN="$READ_TOKEN" gh release download "$TAG" --repo "$BREAKAWAY_REPO" --dir release --pattern manifest.json --clobber
          GH_TOKEN="$READ_TOKEN" gh release view "$TAG" --repo "$BREAKAWAY_REPO" --json body --jq .body > release/notes.md
          node "$CLI" install update --releases releases.json --repo "$BREAKAWAY_REPO" --manifest release/manifest.json --notes release/notes.md --body release/body.md > /dev/null
          branch=breakaway/update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add breakaway.json
          git commit -m "$TITLE"
          git push --force-with-lease origin "$branch" || git push --force origin "$branch"
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$TITLE" --body-file release/body.md
          else
            gh pr create --head "$branch" --base "${{ github.event.repository.default_branch }}" --title "$TITLE" --body-file release/body.md
          fi

      - name: Deploy the newer pre-release
        if: ${{ steps.plan.outputs.action == 'deploy' }}
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
