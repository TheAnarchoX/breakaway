# Deploys a breakaway release to this install's Worker: the release breakaway.json pins (stable), or the latest
# pre-release (main). Runs on a push to main, which is how a merged update pull request deploys, and by hand.
# A deploy uploads a version of the Worker. A change a version can't carry (the address, cron triggers, or a new
# Durable Object class) needs wrangler deploy: Deploy runs it when the repository variable BREAKAWAY_DEPLOY_CHANGES is
# true, for a token that can (the README says which), and otherwise stops with a plain message, as it does for a release
# that needs steps by hand. It never changes the Worker's name or its Durable Object, which would open an empty board.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check and build the release, and stop before it touches the Worker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Where the releases come from. A fork changes both.
  BREAKAWAY_REPO: TheAnarchoX/breakaway
  BREAKAWAY_FEED: ${{ vars.BREAKAWAY_FEED }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are secrets of this environment. breakaway's repository is public,
    # so this repository's own token reads its releases; BREAKAWAY_READ_TOKEN, a repository secret (Update reads it
    # too), is only for a BREAKAWAY_REPO that's private, like a private fork: a read-only token for its releases.
    environment: production
    env:
      GH_TOKEN: ${{ secrets.BREAKAWAY_READ_TOKEN || github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRY_RUN: ${{ inputs.dry-run }}
      # true lets Deploy run wrangler deploy for an address, cron triggers, or a new Durable Object class (BRK-62).
      DEPLOY_CHANGES: ${{ vars.BREAKAWAY_DEPLOY_CHANGES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Pick the release
        id: release
        run: |
          set -euo pipefail
          # breakaway's CLI comes from a release's own source on GitHub, read with the same token as the release's files
          # (BRK-61): it needs only Node, no npm package, so it works while breakaway's repository is private.
          unpack() {
            dir="$RUNNER_TEMP/breakaway-$1"
            if [ ! -d "$dir" ]; then
              mkdir -p "$dir"
              gh release download "$1" --repo "$BREAKAWAY_REPO" --archive tar.gz -O - | tar -xz -C "$dir" --strip-components 1
            fi
            echo "$dir/scripts/tasks.mjs"
          }
          # The newest release's CLI picks the release to deploy.
          newest=$(gh release list --repo "$BREAKAWAY_REPO" --limit 1 --json tagName --jq '.[0].tagName // empty') || newest=""
          if [ -z "$newest" ]; then
            echo "::error title=No release to read::This repository can't read a release of $BREAKAWAY_REPO. If that repository is private, add BREAKAWAY_READ_TOKEN as a repository secret: a fine-grained token with read access to its contents."
            exit 1
          fi
          picker=$(unpack "$newest")
          curl -fsS --retry 3 "$BREAKAWAY_FEED" -o releases.json || echo '{}' > releases.json
          if ! node "$picker" install resolve --releases releases.json --repo "$BREAKAWAY_REPO" > release.out; then
            # The feed has no release (it's down, or has none of BREAKAWAY_REPO's): ask GitHub.
            gh api "repos/$BREAKAWAY_REPO/releases?per_page=100" > releases.json
            node "$picker" install resolve --releases releases.json --repo "$BREAKAWAY_REPO" > release.out
          fi
          cat release.out >> "$GITHUB_OUTPUT"
          # The steps after this one run the chosen release's own CLI, which makes that release's Worker config.
          echo "cli=$(unpack "$(sed -n 's/^tag=//p' release.out)")" >> "$GITHUB_OUTPUT"

      - name: Download and verify the release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$TAG" --repo "$BREAKAWAY_REPO" --dir release \
            --pattern breakaway-bundle.tar.gz --pattern manifest.json --pattern SHA256SUMS
          (cd release && sha256sum --check SHA256SUMS)

      - name: Check it can deploy by itself
        id: check
        env:
          CLI: ${{ steps.release.outputs.cli }}
          VERSION: ${{ steps.release.outputs.version }}
          BEFORE: ${{ github.event.before }}
          ADDRESS: ${{ vars.BREAKAWAY_URL }}
        run: |
          set -euo pipefail
          # The config as it was before this push, to see whether it changed what a version upload can't carry.
          rm -f before.json running.wrangler.json
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) ;; *) git show "$BEFORE:breakaway.config.json" > before.json 2>/dev/null || rm -f before.json ;; esac
          was=breakaway.config.json
          if [ -f before.json ]; then was=before.json; fi
          # Where the running board answers: the address from before this push, if the push changes it.
          address=${ADDRESS:-$(node -p "require('./$was').url || ''")}
          running=""
          # A board that doesn't say its release (one from before BRK-10) runs none this check knows. Nothing is deployed
          # yet on the first run, so there is no running release to compare with.
          if [ -n "$address" ]; then running=$(curl -fsS --max-time 20 "$address/api/ping" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).release ?? ''" 2>/dev/null || true); fi
          # The Worker as it runs: the config the running release's own CLI makes from the config it was deployed with, so
          # a release that changes the cron triggers or the Durable Object classes shows as a change too. Without it (the
          # same release, or one that can't be read), the check compares the configs with this release's code.
          if [ -n "$running" ] && [ "$running" != "$VERSION" ]; then
            dir="$RUNNER_TEMP/running"
            mkdir -p "$dir/src"
            if gh release download "v$running" --repo "$BREAKAWAY_REPO" --archive tar.gz -O - 2>/dev/null | tar -xz -C "$dir/src" --strip-components 1 2>/dev/null; then
              cp "$was" "$dir/breakaway.config.json"
              (cd "$dir" && node src/scripts/tasks.mjs install config --out "$GITHUB_WORKSPACE/running.wrangler.json" > /dev/null 2>&1) || rm -f running.wrangler.json
            fi
          fi
          status=0
          node "$CLI" install check --version "$VERSION" --manifest release/manifest.json --running "$running" \
            --before before.json --running-config running.wrangler.json --deploy-changes "${DEPLOY_CHANGES:-false}" > check.out || status=$?
          cat check.out
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          cat check.out >> "$GITHUB_OUTPUT"
          # Where the running board was asked, and what it said: a Worker that doesn't exist is only a first deploy when
          # no board answered there (BRK-141).
          echo "running=$running" >> "$GITHUB_OUTPUT"
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Make the Worker config
        env:
          CLI: ${{ steps.release.outputs.cli }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -xzf release/breakaway-bundle.tar.gz -C bundle
          # A release carries the packages the Worker imports in its bundle (BRK-56), so nothing is installed. Only a release
          # from before that, which this workflow can still be told to deploy, has none: those two go in bundle/ at the
          # versions it lists (npm run in bundle/worker works out all of breakaway's devDependencies first, and Node 22's
          # npm fails on them, BRK-65). Node and wrangler find them there, walking up from bundle/worker.
          if [ ! -d bundle/node_modules/fflate ] || [ ! -d bundle/node_modules/@noble/ciphers ]; then
            specs=$(node -p "const p = require('./bundle/worker/package.json'), v = { ...p.dependencies, ...p.devDependencies }; ['fflate', '@noble/ciphers'].map((n) => n + '@' + (v[n] ?? 'latest')).join(' ')")
            npm install --prefix bundle --no-save --no-package-lock --no-audit --no-fund $specs
          fi
          node "$CLI" install config --bundle bundle --out wrangler.generated.json

      - name: Find the Worker
        id: worker
        env:
          CLI: ${{ steps.release.outputs.cli }}
          VARIABLE: ${{ vars.BREAKAWAY_URL }}
          RUNNING: ${{ steps.check.outputs.running }}
          CHECKED: ${{ steps.check.outputs.address }}
        run: |
          set -euo pipefail
          # The version the deploy replaces. Only a Worker that doesn't exist is a first deploy: any other failure to list
          # (a wrong account ID, a token that can't read Workers) stops here, because deploying over a live Worker with
          # nothing to roll back to is not safe. And a Worker that doesn't exist on an install that already has a board
          # (BREAKAWAY_URL set, or the address answered) is a changed or mistyped name: that stops too, before the dry run,
          # since deploying it would make a second, empty board (BRK-141).
          if npx --yes wrangler@4 deployments list --json -c wrangler.generated.json > deployments.json 2> list-error.txt; then
            node "$CLI" install previous < deployments.json >> "$GITHUB_OUTPUT"
          else
            cat deployments.json list-error.txt | node "$CLI" install missing --variable "$VARIABLE" --running "$RUNNING" --at "$CHECKED"
            echo "previous=" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry run
        if: ${{ inputs.dry-run }}
        env:
          DEPLOY: ${{ steps.check.outputs.deploy }}
          CHANGES: ${{ steps.check.outputs.changes }}
          PREVIOUS: ${{ steps.worker.outputs.previous }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/dry" -c wrangler.generated.json
          if [ -z "$PREVIOUS" ]; then echo "This is the first deploy: it would make the Worker and its board."
          elif [ "$DEPLOY" != wrangler ]; then echo "A deploy would upload a version."
          elif [ -n "$CHANGES" ]; then echo "A deploy would run wrangler deploy for $CHANGES."
          else echo "A deploy would run wrangler deploy, the release's manual step."; fi

      - name: Upload and deploy
        if: ${{ !inputs.dry-run }}
        env:
          CLI: ${{ steps.release.outputs.cli }}
          VERSION: ${{ steps.release.outputs.version }}
          ADDRESS: ${{ vars.BREAKAWAY_URL }}
          DEPLOY: ${{ steps.check.outputs.deploy }}
          CHANGES: ${{ steps.check.outputs.changes }}
          ADDRESS_CHANGED: ${{ steps.check.outputs.address_changed }}
          PREVIOUS: ${{ steps.worker.outputs.previous }}
        run: |
          set -euo pipefail
          previous=$PREVIOUS
          wrangler() { npx --yes wrangler@4 "$@" -c wrangler.generated.json; }
          # The version the new one replaces (Find the Worker). A first run has none, and `wrangler deploy` makes the Worker
          # and its Durable Object; every run after that uploads a version and deploys it, so it can be rolled back.
          if [ -z "$previous" ]; then
            wrangler deploy --var "BREAKAWAY_VERSION:$VERSION"
          elif [ "$DEPLOY" = wrangler ]; then
            # What a version can't carry (BRK-62): wrangler deploy applies the address, cron triggers, and new Durable
            # Object classes with the code, and the Worker can still go back to $previous unless a class was added.
            if [ -n "$CHANGES" ]; then echo "This deploy changes $CHANGES, so it runs wrangler deploy."; else echo "breakaway $VERSION's manual step is wrangler deploy, so this deploy runs it."; fi
            wrangler deploy --var "BREAKAWAY_VERSION:$VERSION" --message "breakaway $VERSION"
          else
            export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
            wrangler versions upload --var "BREAKAWAY_VERSION:$VERSION" --message "breakaway $VERSION"
            uploaded=$(node -e "const l=require('fs').readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH,'utf8').split('\\n').filter(Boolean).map(JSON.parse).filter(e=>e.type==='version-upload').pop();if(!l)process.exit(1);console.log(l.version_id)")
            wrangler versions deploy "$uploaded@100%" --yes
          fi
          # Health check: the new release answers /api/ping and its secrets load. Without it, go back to the previous version.
          url=$(node -p "require('./breakaway.config.json').url || ''")
          address=${ADDRESS:-$url}
          tries=12
          first=false
          if [ "$ADDRESS_CHANGED" = true ]; then
            # A new address: check it, not the old one, and give its custom domain five minutes for its certificate.
            address=${url:-$ADDRESS}
            tries=60
          fi
          if [ -z "$previous" ]; then
            # A first deploy: its custom domain is new too, and its secrets go on the Worker it just made, so a release that
            # answers without them passes, saying so (BRK-141).
            first=true
            if [ -n "$url" ]; then address=$url; tries=60; fi
          fi
          if [ -z "$address" ]; then
            echo "::warning title=Not checked::There is no address to check. Set the repository variable BREAKAWAY_URL to where the board answers (a workers.dev address, say) and the next deploy checks it."
            exit 0
          fi
          for attempt in $(seq 1 "$tries"); do
            if health=$(curl -fsS --max-time 15 "$address/api/ping" | node "$CLI" install healthy --version "$VERSION" --first "$first"); then
              if [ "$health" = health=secrets ]; then
                echo "::notice title=Waiting for its secrets::breakaway $VERSION is running at $address, and is waiting for its secrets. Put them on the Worker (npx breakaway init-secrets, then .dev.vars.example says where each goes); the board works once they're on."
              else
                echo "breakaway $VERSION is running at $address."
              fi
              exit 0
            fi
            sleep 5
          done
          waited=$([ "$tries" -gt 12 ] && echo "five minutes" || echo "a minute")
          if [ -z "$previous" ]; then
            echo "::error title=Failed its check::breakaway $VERSION didn't answer $address/api/ping within $waited, and this was the first deploy, so there is no version to go back to. A new custom domain can take longer for its certificate: once $address/api/ping answers, the board is up, and its secrets go on next. If it never answers, read the Worker's logs on Cloudflare."
          elif wrangler rollback "$previous" --message "breakaway $VERSION failed its check" --yes; then
            kept=""
            if [ "$DEPLOY" = wrangler ]; then kept=" Rolling back brings back the code only: what wrangler deploy changed${CHANGES:+ ($CHANGES)} stays as it left it."; fi
            echo "::error title=Rolled back::breakaway $VERSION didn't answer $address/api/ping, with its secrets readable, within $waited, so the Worker went back to its previous version.$kept Nothing is lost; read the Worker's logs on Cloudflare."
          else
            echo "::error title=Couldn't roll back::breakaway $VERSION didn't answer $address/api/ping, with its secrets readable, within $waited, and the Worker couldn't go back to its previous version: Cloudflare doesn't roll back across a new Durable Object class. The board's data is still in its Durable Object. Read the Worker's logs on Cloudflare, then deploy a fix."
          fi
          exit 1
