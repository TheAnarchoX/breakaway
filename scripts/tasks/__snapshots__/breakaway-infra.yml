# Rendered by npx breakaway infra init from the environments in .github/breakaway-infra/: add one there and run npx breakaway infra init --update, not this file.
#
# Apply infrastructure: applies one plan the owner approved on the board to one environment, and nothing else. The
# board starts it when a plan is approved; without a plan the board approved for this environment and this run, it
# stops before it reads the write token. That token is CLOUDFLARE_API_TOKEN, a secret of the GitHub environment named
# for the environment (for every short-lived environment, the one GitHub environment named short-lived), which only
# main may use. It checks out none of this repository's code: it runs breakaway's runner, pinned to
# 2.0.0 and installed once, before any step holds the token, from the package's own lockfile with no install
# scripts, and reports each step to the board. Agents never run this workflow.
name: Apply infrastructure
run-name: Apply plan ${{ inputs.plan }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      plan:
        description: The approved plan's ID, from the board
        required: true
        type: string
      environment:
        description: The environment the plan is for
        required: true
        type: choice
        options:
          - "production"
          - "staging"
      github_environment:
        description: The GitHub environment that holds its write token, when it isn't the environment's own (short-lived)
        required: false
        default: ''
        type: string

permissions: {}

# One apply at a time in each environment; the board holds the environment's lock as well.
concurrency:
  group: breakaway-infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: apply
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.github_environment || inputs.environment }}
    # id-token proves to the board which repository, environment, workflow, and run asks for the plan. Nothing is
    # checked out, so the run reads nothing of the repository.
    permissions:
      id-token: write
    env:
      BREAKAWAY_URL: ${{ vars.BREAKAWAY_URL }}
      PLAN: ${{ inputs.plan }}
      ENVIRONMENT: ${{ inputs.environment }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The only download: the package ships npm-shrinkwrap.json and has no dependencies, so this installs exactly
      # what was published, and runs none of its scripts. The steps after it run that copy, so nothing is fetched while
      # the write token is in a step's environment.
      - name: Install the runner
        run: npm install --global --ignore-scripts --no-audit --no-fund breakaway@2.0.0

      - name: Check the plan
        run: breakaway infra runner check

      - name: Apply the plan
        env:
          BREAKAWAY_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: breakaway infra runner apply

      - name: Report the end
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: breakaway infra runner end
