# Deploys breakaway's site (the landing page, the docs, and the update feed) from breakaway's latest stable release, on
# the custom domain in the SITE_HOST variable. It never runs here: copy it into the repository that deploys your board,
# as .github/workflows/site.yml (site/README.md says how). Every hour it looks for a new stable release and deploys it,
# so the docs follow what `npx breakaway` installs; it does nothing when the site already runs that release. Run it by
# hand to deploy the latest stable release now, or a tag or branch of breakaway to put a fix live before the next one.
name: Site

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: A tag or branch of breakaway to deploy (empty for the latest stable release)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

env:
  # Where the site comes from. A fork changes it, and RELEASES_REPO in site/wrangler.jsonc with it.
  BREAKAWAY_REPO: TheAnarchoX/breakaway
  SITE_HOST: ${{ vars.SITE_HOST }}

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, the same secrets as the board's Deploy: the token needs Workers
    # Scripts Edit and, for the custom domain, Workers Routes Edit on SITE_HOST's zone.
    environment: production
    env:
      GH_TOKEN: ${{ secrets.BREAKAWAY_READ_TOKEN || github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
      INPUT_REF: ${{ inputs.ref }}
    steps:
      - name: Pick what to deploy
        id: pick
        run: |
          set -euo pipefail
          if [ -z "$SITE_HOST" ]; then
            echo "::error title=No host::Set the repository variable SITE_HOST to the site's host, like breakaway.example.com."
            exit 1
          fi
          # What the site runs now: its deployed.txt, "<ref> <commit> <deployed at>", which every deploy writes.
          read -r running _ deployed_at < <(curl -fsS --max-time 20 "https://$SITE_HOST/deployed.txt" 2>/dev/null || echo "- - -")
          ref=$INPUT_REF
          if [ -z "$ref" ]; then
            latest=$(gh api "repos/$BREAKAWAY_REPO/releases/latest" --jq '[.tag_name, .published_at] | @tsv' 2>/dev/null || true)
            if [ -z "$latest" ]; then
              echo "$BREAKAWAY_REPO has no stable release yet, so there's nothing to deploy."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            read -r ref published <<< "$latest"
            if [ "$BY_HAND" != true ] && [ "$running" = "$ref" ]; then
              echo "The site already runs $ref."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A fix deployed by hand after this release stays until a newer release comes out.
            if [ "$BY_HAND" != true ] && [ "$deployed_at" != "-" ] && [[ "$deployed_at" > "$published" ]]; then
              echo "The site runs $running, deployed after $ref came out. It stays until a newer release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [ "$running" != "-" ] || running="nothing yet"
          echo "Deploying $ref (the site runs $running)."
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pick.outputs.skip != 'true'
        with:
          repository: ${{ env.BREAKAWAY_REPO }}
          ref: ${{ steps.pick.outputs.ref }}
          token: ${{ env.GH_TOKEN }}
          path: breakaway
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.pick.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Deploy and check
        if: steps.pick.outputs.skip != 'true'
        working-directory: breakaway
        env:
          REF: ${{ steps.pick.outputs.ref }}
        run: |
          set -euo pipefail
          # The pages are committed as they build, so there's nothing to build: only say what this deploy is.
          printf '%s %s %s\n' "$REF" "$(git rev-parse --short HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/public/deployed.txt
          npx --yes wrangler@4 deploy -c site/wrangler.jsonc --domain "$SITE_HOST" --message "site $REF"
          # The check: the site serves this deploy's deployed.txt, and the feed answers.
          for attempt in $(seq 1 12); do
            if [ "$(curl -fsS --max-time 15 "https://$SITE_HOST/deployed.txt" || true)" = "$(cat site/public/deployed.txt)" ] &&
              curl -fsS --max-time 15 -o /dev/null "https://$SITE_HOST/releases.json"; then
              echo "The site runs $REF at https://$SITE_HOST."
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Failed its check::https://$SITE_HOST didn't serve $REF, or its feed didn't answer, within a minute. Read the Worker's logs on Cloudflare, and roll back with wrangler rollback if the site is down."
          exit 1
